[package]
name = "flook"
version = "0.1.0"
edition = "2021"
description = "Terminal code browser with file tree and syntax highlighting"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
clap = { version = "4", features = ["derive"] }
